{% extends 'base.html' %}
{% block title %}Login — Our Little Universe{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="login-glow"></div>
    <div class="login-card fade-in">
        <div class="login-orbit" aria-hidden="true"><span class="login-orbit-dot"></span></div>
        <h1 class="login-title">Our Little Universe</h1>
        <p class="login-subtitle">A private space, just for us.</p>

        <form method="POST" action="{{ url_for('auth.login') }}">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required autofocus>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Enter</button>
        </form>
    </div>
</div>
{% endblock %}
