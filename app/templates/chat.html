{% extends 'base.html' %}
{% block title %}Chat — Our Little Universe{% endblock %}

{% block content %}
<div class="container chat-container">
    <section class="chat-shell" id="chatApp" data-me="{{ me_id }}" data-partner="{{ partner.name }}">

        <header class="chat-head">
            <div class="chat-head-text">
                <h1 class="chat-title">{{ partner.name }}</h1>
                <span class="chat-presence" id="presenceLine">&nbsp;</span>
            </div>
            <button type="button" class="chat-icon-btn" id="chatSearchBtn" aria-label="Search messages">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </button>
        </header>

        <div class="chat-search" id="chatSearch" hidden>
            <input type="search" id="chatSearchInput" placeholder="Search this conversation…" autocomplete="off" maxlength="100">
            <div class="chat-search-results" id="chatSearchResults"></div>
        </div>

        <div class="chat-scroll" id="chatScroll">
            <button type="button" class="chat-older" id="loadOlder" hidden>Load earlier messages</button>
            <div class="chat-list" id="chatList" aria-live="polite"></div>
            <div class="chat-typing" id="typingLine" hidden></div>
        </div>

        <div class="chat-error" id="chatError" role="alert" hidden></div>

        <div class="chat-replybar" id="replyBar" hidden>
            <div class="chat-replybar-text">
                <span class="chat-replybar-who" id="replyWho"></span>
                <span class="chat-replybar-preview" id="replyPreview"></span>
            </div>
            <button type="button" class="chat-icon-btn chat-icon-sm" id="replyCancel" aria-label="Cancel reply">&times;</button>
        </div>

        <div class="chat-pending" id="pendingBar" hidden></div>

        <form class="chat-composer" id="chatForm" autocomplete="off">
            <button type="button" class="chat-icon-btn" id="attachBtn" aria-label="Send a photo">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            </button>
            <input type="file" id="imageInput" accept="image/jpeg,image/png,image/gif,image/webp" hidden>

            <textarea id="chatInput" rows="1" maxlength="4000" placeholder="Write a message…" enterkeyhint="send"></textarea>

            <button type="button" class="chat-icon-btn" id="micBtn" aria-label="Record a voice message">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
            </button>
            <button type="submit" class="chat-send" id="sendBtn">Send</button>
        </form>
    </section>
</div>
{% endblock %}

{% block extra_js %}<script src="{{ url_for('static', filename='js/chat.js') }}"></script>{% endblock %}
